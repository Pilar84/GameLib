services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: gunicorn steamlike_backend.wsgi:application --bind 0.0.0.0:8000

  frontend:
    build:
      context: ./Steamlike-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: "https://gamelib.pipayplata.com"
    depends_on:
      - web
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres_data: